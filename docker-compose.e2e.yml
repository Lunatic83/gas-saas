# E2E profile overrides — isolated ports to avoid conflict with dev
# Usage: docker compose --profile e2e up -d
name: gas-saas

services:
  postgres:
    profiles:
      - e2e
    ports:
      - '5532:5432'
    volumes:
      - ./data/postgres_e2e:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: saas_e2e

  redis:
    profiles:
      - e2e
    ports:
      - '6479:6379'
    volumes:
      - ./data/redis_e2e:/data

  mailhog:
    profiles:
      - e2e
    ports:
      - '1125:1025'
      - '8125:8025'
    volumes:
      - ./data/mailhog_e2e:/mailhog
