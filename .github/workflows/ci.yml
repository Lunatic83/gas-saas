name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/workspace" zricethezav/gitleaks:latest detect --source=/workspace --no-color

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript
        run: pnpm type-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Unit tests
        run: pnpm test:unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Start Docker services
        run: docker compose -f docker-compose.integration.yml up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter name=postgres) pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter name=redis) redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 2
          done
          # Give Redis extra time to be ready for connections
          sleep 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set DATABASE_URL
        run: |
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/saas_test" >> $GITHUB_ENV
          echo "DATABASE_URL_TEST=postgres://postgres:postgres@localhost:5432/saas_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV

      - name: Run migrations
        run: pnpm db:push

      - name: Integration tests
        run: pnpm test:integration

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.integration.yml down

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [e2e-full]
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version changes
        id: check
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD^:package.json | jq -r '.version')
          else
            PREV_VERSION="none"
          fi
          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-quality, type-check, test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  e2e-smoke:
    name: E2E Smoke — PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Start Docker services
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter name=postgres) pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

          for i in {1..30}; do
            if docker exec $(docker ps -q --filter name=redis) redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 2
          done

          for i in {1..30}; do
            if nc -z localhost 3100 > /dev/null 2>&1; then
              echo "App is ready on port 3100"
              break
            fi
            sleep 2
          done

          echo "Services ready"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm exec playwright test --project=smoke

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: playwright-report/
          retention-days: 7

  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.version-check.outputs.version-changed == 'true'
    needs: [version-check]
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Start Docker services
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q --filter name=postgres) pg_isready -U postgres > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

          for i in {1..30}; do
            if docker exec $(docker ps -q --filter name=redis) redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 2
          done

          for i in {1..30}; do
            if nc -z localhost 3100 > /dev/null 2>&1; then
              echo "App is ready on port 3100"
              break
            fi
            sleep 2
          done

          echo "Services ready"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full tests
        run: pnpm exec playwright test

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

      - name: Upload full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.version-check.outputs.version-changed == 'true'
    needs: [build-image, version-check]
    steps:
      - name: Deploy to Dokploy
        run: |
          echo "Deploying..."
          curl -s -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"tag":"${{ github.sha }}"}' \
          || echo "Deploy webhook called (stub)"
