name: Sync Labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'

jobs:
  label-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: EndBug/label-sync@v3
        with:
          source-file: '.github/labels.yml'
          delete-old-labels: true
